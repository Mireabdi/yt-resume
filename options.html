<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>YT Resume options</title>
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <main>
    <h1>YT Resume</h1>
    <p class="lead">Changes save automatically and apply to open YouTube tabs right away.</p>

    <section class="group">
      <h2>General</h2>
      <div class="card">
        <label class="row">
          <span class="copy">
            <span class="label">Enabled</span>
            <span class="hint">When off, nothing is saved or resumed. Saved videos are kept.</span>
          </span>
          <input id="enabled" class="switch" type="checkbox" role="switch">
        </label>
      </div>
    </section>

    <section class="group">
      <h2>Tracking</h2>
      <div class="card">
        <label class="row">
          <span class="copy">
            <span class="label">Minimum video length</span>
            <span class="hint">Videos shorter than this many seconds are not tracked. Default 60.</span>
          </span>
          <input id="minDuration" type="number" inputmode="numeric" step="1">
        </label>
        <label class="row">
          <span class="copy">
            <span class="label">Finished threshold</span>
            <span class="hint">A video this many seconds from its end counts as finished and is forgotten. Default 15.</span>
          </span>
          <input id="finishedThreshold" type="number" inputmode="numeric" step="1">
        </label>
        <label class="row">
          <span class="copy">
            <span class="label">Maximum stored videos</span>
            <span class="hint">The oldest entries are dropped beyond this. Default 500.</span>
          </span>
          <input id="maxEntries" type="number" inputmode="numeric" step="1">
        </label>
      </div>
    </section>

    <section class="group">
      <h2>Playback</h2>
      <div class="card">
        <label class="row">
          <span class="copy">
            <span class="label">Rewind on resume</span>
            <span class="hint">Resume this many seconds before where you stopped, to catch up on context. 0 to 30. Default 3.</span>
          </span>
          <input id="rewind" type="number" inputmode="numeric" step="1">
        </label>
      </div>
    </section>

    <div class="actions">
      <button id="reset" type="button">Reset to defaults</button>
      <span id="status" role="status" aria-live="polite"></span>
    </div>
  </main>
  <script src="settings.js"></script>
  <script src="options.js"></script>
</body>
</html>
